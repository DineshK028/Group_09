<!DOCTYPE html>

<html>

<head>
<link rel="stylesheet" href="{{ url_for('static', filename='delivery/login.css') }}">

<title>Delivery Person Login</title>


</head>

<body>

<header>

Welcome to Infy Food Express

<a href="{{ url_for('index') }}" class="index">Index</a>

</header>

<main>

<div class="card">

<h2>Delivery Person Login</h2>

<form method="POST">

<label>Email</label>

<input type="email" name="email" required>

<label>Password</label>

<input type="password" name="password" required>

<div class="buttons">

<button class="login" type="submit">Login</button>

<button class="reset" type="reset">Reset</button>

</div>

<div class="forgot">

<a href="/delivery/forgot_password">Forgot Password</a>

</div>

{% with messages=get_flashed_messages() %}

{% if messages %}

{% for message in messages %}

<div class="message">{{message}}</div>

{% endfor %}

{% endif %}

{% endwith %}

</form>

</div>

</main>

<footer>

Copyright © 2026 Infy Food Express

</footer>

</body>

</html>
