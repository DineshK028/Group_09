<!DOCTYPE html>

<html>

<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='delivery/forgot_password.css') }}">

    <title>Forgot Password</title>


</head>

<body>

<header>

<h1>Welcome to Infy Food Express</h1>

<a href="/delivery/login" class="login-btn">Login</a>

</header>

<div class="container">

<div>

<h2>Delivery Person - Reset Password</h2>

<div class="box">

{% with messages=get_flashed_messages() %}

{% if messages %}

<div class="flash">

{% for msg in messages %}

{{ msg }}

{% endfor %}

</div>

{% endif %}

{% endwith %}

<form method="POST">

<label>Registered Email</label>

<input type="email" name="email" required>

<label>Registered Phone (10 digits)</label>

<input type="text" name="phone" maxlength="10" required>

<label>New Password</label>

<input type="password" name="new_password" required>

<label>Confirm New Password</label>

<input type="password" name="confirm_password" required>

<button type="submit">Reset Password</button>

</form>

</div>

</div>

</div>

<footer>

Copyright © 2026 Infy Food Express

</footer>

</body>

</html>
