<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Owner Reset Password</title>

<style>

*{

    margin:0;

    padding:0;

    /* box-sizing:border-box; */

    font-family:Arial, Helvetaica, sans-serif;

}

body{

    background:#f5f5f5;

}

.container{

    width:100%;

    max-width:100%;

    /* margin:40px auto; */

    /* border:2px solid #333; */

    background:#f6f3d8;

    min-height:650px;

    position:relative;

}

/* Header */

.header{

    background:#17765d;

    color:white;

    height:65px;

    display:flex;

    justify-content:center;

    align-items:center;

    font-size:30px;

    font-weight:bold;

    position:relative;

}

.login-btn{

    position:absolute;

    right:20px;

    top:15px;

    background:#d9d9d9;

    color:#333;

    padding:4px 4px;

    border:none;

    border-radius:20px;

    cursor:pointer;
    font-size: large;

}

/* Form */

.content{

    display:flex;

    justify-content:center;

    align-items:center;

    margin-top:70px;

}

.form-box{

    width:360px;

}

.form-box h2{

    text-align:center;

    margin-bottom:20px;

    color:#333;

}

.card{

    background:#fff;

    padding:25px;

    border-radius:5px;

    box-shadow:0 0 8px rgba(0,0,0,.2);

}

label{

    display:block;

    font-size:14px;

    margin-top:12px;

    margin-bottom:5px;

    font-weight:bold;

}

input{

    width:100%;

    padding:10px;

    border:1px solid #ccc;

    border-radius:3px;

}

button.reset-btn{

    width:100%;

    margin-top:25px;

    padding:12px;

    background:#3b8f2d;

    color:white;

    border:none;

    border-radius:4px;

    font-size:16px;

    cursor:pointer;

}

button.reset-btn:hover{

    background:#2f7724;

}

/* Footer */

.footer{

    position:absolute;

    bottom:0;

    width:100%;

    height:45px;

    background:#17765d;

    color:white;

    display:flex;

    justify-content:center;

    align-items:center;

    font-size:14px;

}
a {
    text-decoration: none;
}

</style>

</head>

<body>

<div class="container">

    <div class="header">

        Welcome to Infy Food Express

        <a href="/owner/login" class="login-btn">Login</a>

    </div>

    <div class="content">

        <div class="form-box">

            <h2>Owner - Reset Password</h2>

            <div class="card">
                <form action="/owner/reset" method="POST">

                <label>Registered Email</label>

                <input type="email" id="email" name="email" placeholder="Enter Email">

                <label>Registered Phone (10 digits)</label>

                <input type="tel" name="phone" maxlength="10" placeholder="Enter Phone Number">

                <label>New Password</label>

                <input type="password" name="password" placeholder="Enter New Password">

                <label>Confirm New Password</label>

                <input type="password" name="confirm" placeholder="Confirm Password">

                <button class="reset-btn">Reset Password</button>
            </form>
            {% with messages = get_flashed_messages() %}

{% if messages %}

    {% for msg in messages %}

        <p style="color:red">{{ msg }}</p>

    {% endfor %}

{% endif %}

{% endwith %}

            </div>

        </div>

    </div>

    <div class="footer">

        Copyright © 2026 Infy Food Express

    </div>

</div>

</body>

</html>
