<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Owner Dashboard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f5f2dc;
            padding-bottom: 60px;
        }

        a {
            text-decoration: none;
            color: #f4f4f4;
        }

        header {
            background: #2f8b57;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 30px;
        }

        header h2 {
            font-size: 22px;
        }

        .nav {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .logout a {
            background: #3cb371;
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 14px;
        }

        h1 {
            text-align: center;
            margin: 40px 0 30px;
            color: #333;
        }

        .container {
            width: 70%;
            margin: auto;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 0 8px rgba(0, 0, 0, 0.2);
            min-width: 600px;
        }

        th,
        td {
            padding: 15px;
            text-align: center;
            color: #2f8b57;
        }

        th {
            background: #f4f4f4;
            color: #333;
        }

        .action-btn {
            background: #3cb371;
            color: white;
            padding: 6px 12px;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            margin: 2px;
        }

        footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #2f8b57;
            color: white;
            text-align: center;
            padding: 10px;
        }

        /* Tablet */
        @media (max-width: 900px) {
            header {
                padding: 12px 20px;
            }

            .container {
                width: 90%;
            }

            h1 {
                margin: 30px 0 25px;
            }
        }

        /* Mobile */
        @media (max-width: 600px) {
            header {
                flex-direction: column;
                gap: 10px;
                text-align: center;
                padding: 15px;
            }

            header h2 {
                font-size: 20px;
            }

            .nav {
                flex-direction: column;
                gap: 10px;
            }

            h1 {
                font-size: 26px;
                margin: 25px 0 20px;
            }

            .container {
                width: 95%;
            }

            table {
                min-width: 600px;
            }

            th,
            td {
                padding: 10px;
                font-size: 14px;
            }

            .action-btn {
                padding: 6px 10px;
                font-size: 13px;
            }

            footer {
                font-size: 13px;
                padding: 9px;
            }
        }

        /* Small phones */
        @media (max-width: 380px) {
            h1 {
                font-size: 23px;
            }

            header h2 {
                font-size: 18px;
            }

            .container {
                width: 96%;
            }

            th,
            td {
                padding: 8px;
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

    <header>

        <h2>Infy Food Express</h2>

        <div class="nav">

            <span>Hi {{ session['username'] }}</span>

            <div class="logout">
                <a href="{{ url_for('owner_logout') }}">Logout</a>
            </div>

        </div>

    </header>


    <h1>Owner Dashboard</h1>


    <div class="container">

        <table>

            <tr>
                <th>Name</th>
                <th>Cuisine</th>
                <th>City</th>
                <th>Manage</th>
            </tr>

            <tr>

                <td>{{ name }}</td>

                <td>{{ cuisine_type }}</td>

                <td>{{ city }}</td>

                <td>

                    <a href="{{ url_for('owner_category_list', restaurant_id=restaurant_id) }}">
                        <button class="action-btn">Categories</button>
                    </a>

                    <a href="{{ url_for('owner_items', restaurant_id=restaurant_id) }}">
                        <button class="action-btn">Items</button>
                    </a>

                    <a href="{{ url_for('owner_orders', restaurant_id=restaurant_id) }}">
                        <button class="action-btn">Orders</button>
                    </a>

                </td>

            </tr>

        </table>

    </div>


    <footer>
        Copyright © 2026 Infy Food Express
    </footer>

</body>

</html>
