<!DOCTYPE html>

<html>

<head>

    <title>Add Category</title>

    <style>

        *{

            margin:0;

            padding:0;

            box-sizing:border-box;

            font-family:Arial, Helvetica, sans-serif;

        }

        body{

            background:#f6f4dc;

        }

        .header{

            background:#0d7b50;

            color:white;

            padding:15px 40px;

            display:flex;

            justify-content:space-between;

            align-items:center;

        }

        .header h2{

            font-size:28px;

        }

        .nav a{

            text-decoration:none;

            color:white;

            background:#2f9f6a;

            padding:8px 16px;

            border-radius:20px;

            margin-left:10px;

        }

        .container{

            display:flex;

            justify-content:center;

            align-items:center;

            height:75vh;

        }

        .card{

            width:420px;

            background:white;

            padding:30px;

            border-radius:8px;

            box-shadow:0px 0px 10px lightgray;

        }

        h2{

            text-align:center;

            margin-bottom:20px;

        }

        label{

            display:block;

            margin-top:15px;

            margin-bottom:5px;

            font-weight:bold;

        }

        input,textarea{

            width:100%;

            padding:10px;

            border:1px solid #ccc;

            border-radius:4px;

        }

        textarea{

            resize:none;

            height:90px;

        }

        button{

            width:100%;

            margin-top:20px;

            padding:12px;

            background:#2d4f4f;

            color:white;

            border:none;

            border-radius:5px;

            cursor:pointer;

        }

        button:hover{

            background:#1d3737;

        }

        .footer{

            position:fixed;

            bottom:0;

            width:100%;

            background:#0d7b50;

            color:white;

            text-align:center;

            padding:10px;

        }

    </style>

</head>

<body>

<div class="header">

<h2>Infy Food Express</h2>

<div class="nav">

<span>Hi {{session['username']}}<span>

<a href="/owner/dashboard">Home</a>

<a href="/logout">Logout</a>

</div>

</div>

<div class="container">

<div class="card">

<h2>Add Category</h2>

<form method="POST">

<label>Category Name</label>

<input

type="text"

name="name"

placeholder="Breakfast"

required>

<label>Description</label>

<textarea

name="description"

placeholder="Enter Description"

required></textarea>

<button type="submit">

Save

</button>

</form>

</div>

</div>

<div class="footer">

Copyright © 2026 Infy Food Express

</div>

</body>

</html>
