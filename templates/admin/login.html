<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: rgb(230, 213, 191);
            font-family: Arial, sans-serif;
            margin: 0;
            overflow-x: hidden;
            min-height: 100vh;
        }

        .header {
            padding: 10px 15px;
            text-align: center;
            color: white;
            background-color: #0b7d3b;
            width: 100%;
            position: relative;
        }

        .header h1 {
            margin: 0;
            font-size: 1.5rem;
        }

        .index {
            position: absolute;
            right: 30px;
            top: 15px;
            text-decoration: none;
            background: white;
            color: black;
            padding: 5px 12px;
            border-radius: 5px;
        }

        .container {
            width: 350px;
            max-width: 90%;
            margin: 80px auto 100px;
            background: white;
            padding: 30px;
            border-radius: 5px;
            box-shadow: 0 0 10px gray;
        }

        h2 {
            text-align: center;
            margin-top: 0;
        }

        label {
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 9px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: 1px solid #aaa;
            border-radius: 3px;
        }

        .login {
            background: green;
            color: white;
            border: none;
        }

        .footer {
            background-color: #0b7d3b;
            color: white;
            text-align: center;
            padding: 10px;
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
        }

        .button-group {
            justify-content: center;
            display: flex;
            gap: 15px;
            margin-top: 20px;
            border: none;
        }

        .button-group button {
            width: 80px;
            height: 35px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 15px;
        }

        .reset {
            background: white;
            color: black;
            border: 1px solid gray !important;
        }

        .button-group button:hover {
            opacity: 0.85;
        }

        /* Mobile */
        @media (max-width: 480px) {

            .header {
                padding: 15px 10px 50px;
            }

            .header h1 {
                font-size: 1.2rem;
            }

            .index {
                right: 50%;
                transform: translateX(50%);
                top: 48px;
                padding: 5px 15px;
            }

            .container {
                width: 90%;
                max-width: 350px;
                margin: 40px auto 90px;
                padding: 25px 20px;
            }

            h2 {
                font-size: 1.3rem;
            }

            input {
                padding: 10px;
            }

            .button-group button {
                width: 90px;
                height: 38px;
            }

            .footer {
                font-size: 12px;
                padding: 9px;
            }
        }

        /* Tablet */
        @media (min-width: 481px) and (max-width: 768px) {

            .header h1 {
                font-size: 1.4rem;
            }

            .container {
                width: 380px;
                max-width: 90%;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Welcome to Infy Food Express</h1>
        <a href="{{ url_for('index') }}" class="index">Index</a>
    </div>

    <div class="container">

        <h2>Admin Login</h2>

        {% with messages=get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <p style="color:red; text-align:center;">{{ message }}</p>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="/admin/auth" method="POST">

            <label>Email</label>
            <br>
            <input type="email" name="email">

            <br>

            <label>Password</label>
            <br>
            <input type="password" name="password">

            <br>

            <div class="button-group">
                <button class="login" type="submit">Login</button>
                <button class="reset" type="reset">Reset</button>
            </div>

        </form>

    </div>

    <div class="footer">
        Copyright © 2026 Infy Food Express
    </div>

</body>
</html>
