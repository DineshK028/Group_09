<!DOCTYPE html>

<html>

<head>

    <title>Add Restaurant</title>

    <style>

        body { background-color:rgb(230, 213, 191); font-family: Arial; margin: 0; }

        .header {

            display: flex; justify-content: space-between; align-items: center;

            padding: 12px 25px; color: white; background-color: #0b7d3b; box-sizing: border-box;

        }

        .header .brand { font-weight: bold; font-size: 1.2em; }

        .header .right { display: flex; align-items: center; gap: 10px; }

        .pill {

            border: none; border-radius: 20px; padding: 6px 16px; font-size: 0.85em;

            font-weight: bold; text-decoration: none; cursor: pointer;

        }

        .pill-white { background: white; color: #0b7d3b; }

        .pill-green { background: #3fae66; color: white; }

        form.inline { margin: 0; }

        .container { display: flex; justify-content: center; padding: 40px 20px; }

        .card { background: white; padding: 35px 45px; border-radius: 8px; box-shadow: 0 0 10px gray; width: 550px; }

        .card h2 { text-align: center; margin-top: 0; margin-bottom: 20px; }

        .flash-msg { color: #c0392b; text-align: center; font-size: 0.9em; margin-bottom: 15px; }

        .field { margin-bottom: 18px; }

        .row { display: flex; gap: 20px; margin-bottom: 18px; }

        .row .field { flex: 1; margin-bottom: 0; }

        label { font-weight: bold; font-size: 0.9em; }

        input, select {

            width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box;

            border: 1px solid #ccc; border-radius: 4px;

        }

        .btn-group { text-align: center; margin-top: 15px; }

        .btn-group button {

            border: none; border-radius: 4px; font-weight: bold;

            cursor: pointer; margin: 0 5px;

        }

        .save-btn { 
            display: inline-block;

background: #0d3b26;

color: white;

text-decoration: none;

padding: 10px 28px;

border-radius: 4px;   /* fully rounded pill */

font-weight: bold;

margin-bottom: 20px;}

        .reset-btn { background: #eee; color: #333; }

        .footer{
            background-color: #0b7d3b;
            color:white;
            text-align: center;
            padding: 10px;
            position: fixed;
            bottom: 0;
            width:100%;
        }

    </style>

</head>

<body>

    <div class="header">

        <div class="brand">Infy Food Express</div>

        <div class="right">

            <span class="pill pill-white">Hi {{ admin_name }}</span>

            <a href="{{ url_for('admin_dashboard') }}" class="pill pill-green">Home</a>

            <form class="inline" action="{{ url_for('admin_logout') }}" method="POST">

                <button type="submit" class="pill pill-green">Logout</button>

            </form>

        </div>

    </div>

    <div class="container">

        <div class="card">

            <h2>Add Restaurant</h2>

            {% with messages = get_flashed_messages() %}

                {% if messages %}

                    {% for message in messages %}

                        <div class="flash-msg">{{ message }}</div>

                    {% endfor %}

                {% endif %}

            {% endwith %}

            <form action="{{ url_for('admin_add_restaurant') }}" method="POST">

                <div class="field">

                    <label>Owner</label>

                    <select name="owner_id" required>

                        {% for owner in owners %}

                            <option value="{{ owner[0] }}">{{ owner[1] }}</option>

                        {% endfor %}

                    </select>

                </div>

                <div class="field">

                    <label>Restaurant Name</label>

                    <input type="text" name="name" required>

                </div>

                <div class="field">

                    <label>Cuisine Type</label>

                    <input type="text" name="cuisine_type" required>

                </div>

                <div class="field">

                    <label>Address</label>

                    <input type="text" name="address" required>

                </div>

                <div class="row">

                    <div class="field">

                        <label>City</label>

                        <input type="text" name="city" required>

                    </div>

                    <div class="field">

                        <label>ZIP Code</label>

                        <input type="text" name="zip_code" maxlength="6">

                    </div>

                </div>

                <div class="row">

                    <div class="field">

                        <label>Contact Phone</label>

                        <input type="text" name="contact_phone" maxlength="10" required>

                    </div>

                    <div class="field">

                        <label>Contact Email</label>

                        <input type="email" name="contact_email" required>

                    </div>

                </div>

                <div class="row">

                    <div class="field">

                        <label>Delivery Fee</label>

                        <input type="number" step="1.00"  name="delivery_fee" value="15.00">

                    </div>

                    <div class="field">

                        <label>Minimum Order</label>

                        <input type="number" step="1" name="minimum_order" value="1" min="1">

                    </div>

                </div>

                <div class="btn-group">

                    <button type="submit" class="save-btn">Add Restaurant</button>

                    <button type="reset" class="reset-btn">Reset</button>

                </div>

            </form>

        </div>

    </div>

    <div class="footer">

        Copyright &copy; 2026 Infy Food Express

    </div>

</body>

</html>
