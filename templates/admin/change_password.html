<!DOCTYPE html>
<html>
<head>
    <title>Change Password</title>

    <style>

        body{
            margin:0;
            font-family:Arial, Helvetica, sans-serif;
            background:rgb(230, 213, 191);
        }

        header{
            display:flex;
            justify-content:space-between;
            align-items:center;
            background:#0b7d3b;
            color:white;
            padding:12px 25px;
        }

        .brand{
            font-size:28px;
            font-weight:bold;
        }

        .right{
            display:flex;
            gap:10px;
            align-items:center;
        }

        .pill{
            text-decoration:none;
            border:none;
            border-radius:20px;
            padding:8px 18px;
            font-size:14px;
            font-weight:bold;
        }

        .white{
            background:white;
            color:#0b7d3b;
        }

        .green{
            background:#2f6d39;
            color:white;
        }

        .container{
            display:flex;
            justify-content:center;
            margin-top:40px;
        }

        .card{
            width:500px;
            background:white;
            padding:30px;
            border-radius:8px;
            box-shadow:0px 0px 10px gray;
        }

        h2{
            text-align:center;
            margin-top:0;
            margin-bottom:25px;
        }

        .flash{
            color:red;
            text-align:center;
            margin-bottom:15px;
            font-weight:bold;
        }

        .field{
            margin-bottom:18px;
        }

        label{
            font-weight:bold;
            display:block;
            margin-bottom:6px;
        }

        input{
            width:100%;
            padding:10px;
            border:1px solid #cccccc;
            border-radius:4px;
            box-sizing:border-box;
        }

        .buttons{
    text-align:center;
    margin-top:25px;
}

.btn{
    background:#123b2a;
    color:white;
    border:none;
    border-radius:4px;
    padding:10px 28px;
    font-weight:bold;
    cursor:pointer;
    font-size:14px;
}

.btn:hover{
    background:#0d2f20;
}


        .save{
            background:#0d3b26;
            color:white;
        }

        .reset{
            background:#888;
            color:white;
        }

        .back{
            display:inline-block;
            text-decoration:none;
            background:#0d3b26;
            color:white;
            padding:10px 22px;
            border-radius:4px;
            font-weight:bold;
            margin-top:15px;
        }

        footer{
            position:fixed;
            bottom:0;
            width:100%;
            background:#0b7d3b;
            color:white;
            text-align:center;
            padding:10px;
        }

    </style>

</head>

<body>

<header>

    <div class="brand">
        Infy Food Express
    </div>

    <div class="right">

        <span class="pill white">
            Hi {{ admin_name }}
        </span>

        <a href="{{ url_for('admin_dashboard') }}" class="pill green">
            Home
        </a>

        <a href="{{ url_for('admin_logout') }}" class="pill green">
            Logout
        </a>

    </div>

</header>

<div class="container">

<div class="card">

<h2>Change Password</h2>

{% with messages = get_flashed_messages() %}
{% if messages %}
{% for message in messages %}

<div class="flash">
    {{ message }}
</div>

{% endfor %}
{% endif %}
{% endwith %}

<form method="POST">

<div class="field">

<label>Current Password</label>

<input type="password"
       name="current_password"
       required>

</div>

<div class="field">

<label>New Password</label>

<input type="password"
       name="new_password"
       required>

</div>

<div class="field">

<label>Confirm New Password</label>

<input type="password"
       name="confirm_password"
       required>

</div>

<div class="buttons">

<button type="submit" class="btn save">
Update Password
</button>


</div>

</form>

</div>

</div>

<footer>

Copyright © 2026 Infy Food Express

</footer>

</body>
</html>
